name: "Lint (Mobile)"

on:
    pull_request:
        paths:
            - ".github/workflows/mobile-lint.yml"
            - "mobile/**"
            - "rust/apps/codegen/**"
            - "rust/bindings/frb/**"
            - "rust/Cargo.lock"
            - "rust/Cargo.toml"
            - "rust/crates/cast/**"
            - "rust/crates/contacts/**"
            - "rust/crates/core/**"
            - "rust/crates/image/**"
            - "rust/crates/ml/**"
            - "rust/crates/photos/**"
    workflow_dispatch:
      inputs:
        leg:
          description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
          type: choice
          options: [instrumented, baseline]
          default: instrumented
        profile:
          description: "CrashOverride chalk profile"
          type: string
          default: curiosity-tests-racecar
        racecar_run:
          description: "racecar correlation token, echoed into the run name"
          type: string
          default: ""

permissions:
    contents: read
    id-token: write

env:
    # The one variable that separates the arms: on baseline, action-checkout
    # skips its Set up Chalk step entirely.
    CHALK_ON: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
    RUSTFLAGS: -D warnings

run-name: "Lint (Mobile) ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code and submodules
              uses: crashappsec/action-checkout@main
              with:
                  chalk: ${{ env.CHALK_ON }}
                  profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
                  observables_continue_on_error: false
                  lfs: false
                  submodules: recursive
            - name: Assert instrumentation is live
              if: env.CHALK_ON == 'true'
              run: |
                test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
                test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

            - name: Verify frozen mobile pubspecs
              run: ruby mobile/checks/frozen-pubspecs/check.rb mobile

            - name: Verify source ARB plurals
              run: ruby mobile/checks/source-arb-plurals/check.rb

            - name: Verify auth custom icons
              run: |
                  find assets/custom-icons -type f -name "*.svg" | while read -r file; do
                      name=$(basename "$file")
                      if [[ "$name" != "$(printf "%s" "$name" | tr '[:upper:]' '[:lower:]' | tr ' ' '_')" ]]; then
                          echo "File name is not lowercase: $file"
                          exit 1
                      fi

                      if [[ "$file" == "assets/custom-icons/icons/bbs_nga.svg" ]]; then
                          continue
                      fi

                      size=$(wc -c < "$file")
                      if (( size > 20480 )); then
                          echo "File size is greater than 20KB: $file ($size bytes)"
                          exit 1
                      fi
                  done

                  jq empty assets/custom-icons/_data/custom-icons.json
                  jq -r '.icons[] | select(.hex != null) | .hex' assets/custom-icons/_data/custom-icons.json | while read -r hex; do
                      if [[ -n "$hex" && ! "$hex" =~ ^[0-9a-fA-F]{6}$ ]]; then
                          echo "Invalid hex color '$hex'. Must be exactly 6 hexadecimal characters."
                          exit 1
                      fi
                  done
              working-directory: mobile/apps/auth

            - name: Install Flutter
              uses: ./.github/actions/setup-flutter

            # Restore-only; primed on main by warm-caches.yml.
            - name: Restore Rust cache
              uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
              with:
                  workspaces: rust
                  shared-key: rust-flutter
                  save-if: false

            - run: cargo codegen frb
              working-directory: rust

            - run: cargo clippy -p ente-photos-frb --features flutter --all-targets --locked
              working-directory: rust

            - run: cargo clippy -p ente-locker-frb --features flutter --all-targets --locked
              working-directory: rust

            - run: flutter pub get --enforce-lockfile
              working-directory: mobile

            - run: dart format --output=none --set-exit-if-changed .
              working-directory: mobile

            - run: flutter analyze --no-pub
              working-directory: mobile

            - name: Test
              working-directory: mobile
              run: |
                  test_package() (
                      member=${1#"$PWD/"}
                      echo "Testing $member"
                      cd "$member"
                      flutter test --no-pub
                  )
                  export -f test_package

                  dart pub workspace list --json |
                      jq -r '.packages[] | select(.name != "ente_workspace") | .path' |
                      while IFS= read -r member; do
                          if [[ -d "$member/test" ]]; then
                              printf '%s\n' "$member"
                          fi
                      done |
                      xargs -P4 -n1 bash -e -c 'test_package "$1"' _
